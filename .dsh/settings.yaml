# ═══ 此值改动需人工确认 ═══
# agent-default-model 决定所有会话的默认模型出口，改动必须由使用者拍板，
# agent 不得自改（事故 A：2026-09-22 被自改为 mimo-v2.6-pro，现已回滚）。
# 按量计费的 provider（如 deepseek-official）不得进入默认链路。
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-presets:
  default: cordis
llm-pi-ai:
  providers:
    kimi-coding:
      apiKeyEnv: KIMI_CODING_API_KEY
    xiaomi-token-plan-ams:
      apiKeyEnv: XIAOMI_TOKEN_PLAN_AMS_API_KEY
      baseURL: https://token-plan-cn.xiaomimimo.com/v1
      models:
        - id: mimo-v2-pro
          name: MiMo-V2-Pro
          contextWindow: 1048576
          maxTokens: 131072
        - id: mimo-v2.5
          name: MiMo-V2.5
          contextWindow: 1048576
          maxTokens: 131072
        - id: mimo-v2.5-pro
          name: MiMo-V2.5-Pro
          contextWindow: 1048576
          maxTokens: 131072
        - id: mimo-v2.6-pro
          name: MiMo-V2.6-Pro
          contextWindow: 1048576
          maxTokens: 131072
        - id: mimo-v2.6-flash
          name: MiMo-V2.6-flash
agent-default-model:
  provider: xiaomi-token-plan-ams
  model: mimo-v2.5-pro
llm-deepseek:
  models:
    - id: deepseek-v4-flash
      name: DeepSeek-V4-Flash
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      contextWindow: 1000000
      inputModalities:
        - text
    - id: deepseek-v4-flash-vision-exp
      name: DeepSeek-V4-Flash-Vision-Exp
      contextWindow: 1000000
      inputModalities:
        - text
        - image
      imagePixelBudget: 640000
      imageMaxBytes: 1048576
    - id: deepseek-flash
      name: DeepSeek-v4.1
ui-theme:
  preference: dark
ui-conversation:
  busyEnter: steer
